<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="https://jsdelivr.net"> -->
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div id="page">
        <!-- MAIN FORM CONTAINER -->
    <section class="form-container" id="form-container">

        <!-- LOGIN FORM CONTAINER -->
        <div class="form-wrapper" id="login-form">
        <div id="my-heading">
            <h1 id="heading">Login</h1>
            <div class="bar"></div>
        </div>

        <div class="input">
            <input type="text" name="Username" id="username" class="input-text" required>
            <label for="" class="label">Username</label>
            <!-- <span class="label-icon">&#128100;</span> -->
        </div>
        <div class="input">
            <input type="text" name="password" id="password" class="input-text" required>
            <label for="" class="label">Password</label>
            <!-- <span class="label-icon">&#128274;</span> -->
        </div>
        <div id="footer">
            <input type="button" value="Login" class="button" id="btn">

            <p>Don't have an account? <a href="####" id="go-to-signup">Sign up</a></p>
        </div>
        </div>

        <!-- SIGNUP FORM CONTAINER -->
        <div class="form-wrapper" id="signup-form">
        <div id="my-heading">
            <h1 id="heading">Sign up</h1>
            <div class="bar"></div>
        </div>

        <div class="input">
            <input type="text" name="new-username" id="new-username" class="input-text" required>
            <label for="" class="label">Username</label>
            <!-- <span class="label-icon">&#128100;</span> -->
        </div>
        <div class="input">
            <input type="email" name="email" id="email" class="input-text" required>
            <label for="">Email</label>
            <!-- <span class="label-icon">&#128231;</span> -->
        </div>
        <div class="input">
            <input type="text" name="new-password" id="new-password" class="input-text" required>
            <label for="" class="label">Password</label>
            <!-- <span class="label-icon">&#128274;</span> -->

        </div>
        <div id="footer">
            <input type="button" value="SIgn up" class="button" id="btn">

            <p>Already have an acconnt? <a href="####" id="go-to-login">Login</a></p>
        </div>
        </div>
    </section>

    <!-- THE DIAGONAL WELCOME PANEL -->
    <section class="welcome_section" id="welcome-section">
        <div class="welcome-content" id="welcome-content">
        <h2 id="welcome-heading">WELCOME BACK!</h2>
        <p id="my-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Eaque numquam.</p>
        </div>
    </section>
    </div>
</body>
</html>
